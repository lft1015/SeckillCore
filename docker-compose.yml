services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: seckill_core
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: seckill-rmq-namesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: seckill-rmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
    restart: unless-stopped

  # ==================== 后端服务 ====================

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: seckill-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/seckill_core?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      JAVA_TOOL_OPTIONS: -Drocketmq.log.root=/tmp/rocketmqlogs
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  # ==================== 前端服务 ====================

  portal:
    build:
      context: .
      dockerfile: deploy/docker/frontend/Dockerfile
      args:
        APP_DIR: frontend/seckill-portal
    container_name: seckill-portal
    depends_on:
      - backend
    ports:
      - "${PORTAL_PORT:-3000}:80"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/docker/frontend/Dockerfile
      args:
        APP_DIR: frontend/seckill-admin
    container_name: seckill-admin
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-3001}:80"
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: deploy/docker/frontend/Dockerfile
      args:
        APP_DIR: frontend/seckill-monitor
    container_name: seckill-monitor
    depends_on:
      - backend
    ports:
      - "${MONITOR_PORT:-3002}:80"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
