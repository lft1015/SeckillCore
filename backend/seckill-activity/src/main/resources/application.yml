server:
  port: 8086

spring:
  config:
    import: optional:classpath:application-common.yml
  application:
    name: seckill-activity
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seckill_core?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.reditickets.activity.entity
  global-config:
    db-config:
      id-type: assign_id # 自动分配ID
      logic-delete-field: isDeleted # 逻辑删除字段
      logic-delete-value: 1 # 逻辑删除值为1
      logic-not-delete-value: 0 # 逻辑未删除值为0
      update-strategy: not_null # 更新策略为非空
  configuration:
    map-underscore-to-camel-case: true # 下划线映射为驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 日志实现为标准输出