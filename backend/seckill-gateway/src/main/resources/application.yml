server:
  port: 8080

spring:
  application:
    name: seckill-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    gateway:
      routes:
        - id: seckill-interface
          uri: lb://seckill-interface
          predicates:
            - Path=/api/**