apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-gateway
  namespace: seckill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seckill-gateway
  template:
    metadata:
      labels:
        app: seckill-gateway
    spec:
      containers:
        - name: seckill-gateway
          image: seckill-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: NACOS_SERVER_ADDR
              value: "nacos:8848"
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-gateway
  namespace: seckill
spec:
  type: NodePort
  selector:
    app: seckill-gateway
  ports:
    - port: 8080
      nodePort: 30080